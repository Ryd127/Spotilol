name: Build Spotify MediaProbe

on:
  workflow_dispatch:
  push:
    branches: [ 'tool/spotify-mediaprobe' ]

permissions:
  contents: read

env:
  ANDROID_PLATFORM_PACKAGE: '37.0'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install             "platform-tools"             "platforms;android-${ANDROID_PLATFORM_PACKAGE}"             "build-tools;${ANDROID_BUILD_TOOLS}"
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Lint and build MediaProbe
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --warning-mode all --console=plain             :mediaprobe:lintDebug             :mediaprobe:assembleDebug

      - name: Verify MediaProbe APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist

          apks=(mediaprobe/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one MediaProbe debug APK, found ${#apks[@]}" >&2
            exit 1
          fi

          apk="${apks[0]}"
          app_id="$(apkanalyzer manifest application-id "$apk" | tr -d '\r\n')"
          version_name="$(apkanalyzer manifest version-name "$apk" | tr -d '\r\n')"
          version_code="$(apkanalyzer manifest version-code "$apk" | tr -d '\r\n')"
          min_sdk="$(apkanalyzer manifest min-sdk "$apk" | tr -d '\r\n')"
          target_sdk="$(apkanalyzer manifest target-sdk "$apk" | tr -d '\r\n')"
          debuggable="$(apkanalyzer manifest debuggable "$apk" | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"

          echo "APK identity: id=${app_id} version=${version_name}(${version_code}) minSdk=${min_sdk} targetSdk=${target_sdk} debuggable=${debuggable}"

          [[ "$app_id" == "com.project.lol.mediaprobe" ]]
          [[ "$version_name" == "1.0.0" ]]
          [[ "$version_code" == "1" ]]
          [[ "$min_sdk" == "28" ]]
          [[ "$target_sdk" == "36" ]]
          [[ "$debuggable" == "true" ]]

          "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign" -c -P 16 -v 4 "$apk" >/dev/null
          "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "$apk"

          output="dist/MediaProbe-Spotify-1.0.0-debug.apk"
          cp "$apk" "$output"
          sha256sum "$output" | tee dist/SHA256SUMS.txt

      - name: Upload MediaProbe
        uses: actions/upload-artifact@v7
        with:
          name: MediaProbe-Spotify-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/MediaProbe-Spotify-1.0.0-debug.apk
            dist/SHA256SUMS.txt

      - name: Upload MediaProbe diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MediaProbe-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            mediaprobe/build/reports/**
            mediaprobe/build/outputs/apk/debug/*.apk
