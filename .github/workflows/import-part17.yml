name: Import Spotilol Part 17 RC

on:
  push:
    branches: [ main ]
    paths:
      - '.part17-import/**'
      - '.github/workflows/import-part17.yml'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout import payload
        uses: actions/checkout@v4

      - name: Reconstruct and verify Part 17 archive
        shell: bash
        run: |
          set -euo pipefail
          cat .part17-import/chunk-*.b64 > /tmp/spotilol-part17.b64
          base64 --decode /tmp/spotilol-part17.b64 > /tmp/spotilol-part17.zip
          echo "ecf944422c15122a078ecabe4b9ccf2a3f1565731651de60089d05862b86f4a2  /tmp/spotilol-part17.zip" | sha256sum -c -
          mkdir -p /tmp/spotilol-unpack
          unzip -q /tmp/spotilol-part17.zip -d /tmp/spotilol-unpack
          test -f /tmp/spotilol-unpack/Spotilol-1.1.8/settings.gradle.kts
          test -f /tmp/spotilol-unpack/Spotilol-1.1.8/.github/workflows/build-apk.yml

      - name: Replace bootstrap tree with Part 17 source
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/import-part17.yml /tmp/import-part17.yml
          git fetch origin main
          git checkout -B part17-import origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.github/workflows/' /tmp/spotilol-unpack/Spotilol-1.1.8/ ./
          mkdir -p .github/workflows
          cp /tmp/import-part17.yml .github/workflows/import-part17.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Spotilol Part 17 RC source"
          git push origin HEAD:main
