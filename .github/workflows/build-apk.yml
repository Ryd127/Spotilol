name: Build Spotilol APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'feature/upstream-1.2.0-integration' ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: read

env:
  ANDROID_PLATFORM: '37'
  ANDROID_PLATFORM_PACKAGE: '37.0'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK: '28.2.13676358'
  ANDROID_CMAKE: '3.22.1'
  SPOTILOL_PRODUCTION_CERT_SHA256: 'a5757d4bca7f0939accc83d8e9b73017b18c6af45ae5f8eba694249f80eba985'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Checkout pinned upstream Spotilol 1.2.0
        uses: actions/checkout@v7
        with:
          repository: lyssadev/Spotilol
          ref: a62e55dee71ecf558136d52958d89fac5ed6599b
          path: pinned-upstream-120
          persist-credentials: false

      - name: Apply Vivo hybrid compatibility overlay
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C pinned-upstream-120 rev-parse HEAD)" == "a62e55dee71ecf558136d52958d89fac5ed6599b" ]]
          mkdir -p ci-logs
          echo '8f688b1bdaaf0f50a49d809f24ff74559d503dd0606b714622c897b79669a211  ci/hybrid/spotilol-1.2.0-vivo-hybrid1.patch.br' | sha256sum --status -c -
          cp app/src/main/java/com/project/lol/service/SpotifyArtworkProvider.kt "$RUNNER_TEMP/SpotifyArtworkProvider.kt"
          cp app/proguard-rules.pro "$RUNNER_TEMP/stable-proguard-rules.pro"
          cp gradle/wrapper/gradle-wrapper.properties "$RUNNER_TEMP/gradle-wrapper.properties"
          mv pinned-upstream-120 "$RUNNER_TEMP/spotilol-upstream-120"
          rsync -a --delete \
            --exclude='.git/' --exclude='.github/' --exclude='ci/' \
            --exclude='ci-logs/' --exclude='scripts/' \
            --exclude='app/src/test/' \
            --exclude='app/src/main/cpp/' \
            --exclude='lame/CMakeLists.txt' --exclude='opus/CMakeLists.txt' \
            --exclude='app/src/main/java/com/project/lol/webview/TrustedOrigins.kt' \
            "$RUNNER_TEMP/spotilol-upstream-120/" ./
          cp "$RUNNER_TEMP/gradle-wrapper.properties" gradle/wrapper/gradle-wrapper.properties
          mkdir -p app/src/main/java/com/project/lol/service
          cp "$RUNNER_TEMP/SpotifyArtworkProvider.kt" app/src/main/java/com/project/lol/service/
          cat "$RUNNER_TEMP/stable-proguard-rules.pro" >> app/proguard-rules.pro
          python3 - <<'PY'
          import subprocess
          checks={
            'app/build.gradle.kts':'a34feb54790191b6c7aea80ce79cd5acfdcacd9b',
            'app/src/main/java/com/project/lol/service/MediaNotificationService.kt':'21ce0a0524cbae63fe8937f4e308ac6fdea2b17e',
            'app/src/main/java/com/project/lol/bridge/OriginScopedBridge.kt':'3afc871a426e9f29117147d6fb640df0a35c3bb1'
          }
          for path,expected in checks.items():
            actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
            assert actual==expected,(path,actual,expected)
          PY
          node -e 'const fs=require("fs"),z=require("zlib");fs.writeFileSync("/tmp/spotilol-hybrid1.patch",z.brotliDecompressSync(fs.readFileSync("ci/hybrid/spotilol-1.2.0-vivo-hybrid1.patch.br")))'
          git apply --check /tmp/spotilol-hybrid1.patch
          git apply /tmp/spotilol-hybrid1.patch
          # The public upstream archive does not contain credentials for Firebase Gradle tasks.
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('app/build.gradle.kts')
          data=gradle.read_text()
          for entry in ['    id("com.google.gms.google-services")\n', '    id("com.google.firebase.crashlytics")\n']:
            assert data.count(entry)==1,entry
            data=data.replace(entry,'',1)
          native_configuration = '''    externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
              packaging {
                  jniLibs {
                      pickFirsts += setOf(
                          "**/libandroidx.graphics.path.so",
                          "**/libdatastore_shared_counter.so"
                      )
                  }
              }
          '''
          assert data.count('    buildFeatures {') == 1
          data = data.replace('    buildFeatures {', native_configuration + '    buildFeatures {', 1)
          assert data.count('    implementation(libs.androidx.core.ktx)') == 1
          data = data.replace(
              '    implementation(libs.androidx.core.ktx)',
              '    implementation(libs.androidx.datastore)\n'
              '    testImplementation("junit:junit:4.13.2")\n'
              '    implementation(libs.androidx.core.ktx)', 1)
          gradle.write_text(data)
          catalog = Path('gradle/libs.versions.toml')
          vc = catalog.read_text()
          assert vc.count('glance = "1.2.0"') == 1
          assert vc.count('[libraries]') == 1
          assert vc.count('composeBom = "2026.06.01"') == 1
          vc = vc.replace('composeBom = "2026.06.01"', 'composeBom = "2026.09.00"', 1)
          vc = vc.replace('glance = "1.2.0"', 'glance = "1.2.0"\ndatastore = "1.2.1"', 1)
          vc = vc.replace(
              '[libraries]',
              '[libraries]\nandroidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }', 1)
          catalog.write_text(vc)
          assert Path('app/src/main/cpp/CMakeLists.txt').is_file()
          assert 'max-page-size=16384' in Path('lame/CMakeLists.txt').read_text()
          assert 'max-page-size=16384' in Path('opus/CMakeLists.txt').read_text()
          media=Path('app/src/main/java/com/project/lol/service/MediaNotificationService.kt').read_text()
          assert media.count('fun updateFromMediaStatus(json: String)')==1
          assert 'com.spotify.music.extra.ART_HTTPS_URI' in media
          assert 'lastMetadataKey' in media
          assert 'currentArtUri: Uri?' in media
          print('Integrated upstream 1.2.0 + Vivo/artwork/performance patch')
          PY
          # Firebase is optional for the Vivo test package ID.
          python3 ci/hybrid/guard_optional_firebase.py
          python3 ci/hybrid/apply_playback_stability.py
          python3 ci/hybrid/optimize_ui_sync.py

      - name: Verify Gradle wrapper integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          expected_jar_sha="7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d"
          actual_jar_sha="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          {
            echo "Expected wrapper JAR SHA-256: ${expected_jar_sha}"
            echo "Actual wrapper JAR SHA-256:   ${actual_jar_sha}"
            grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties
            grep '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties
          } | tee ci-logs/gradle-wrapper-integrity.log
          [[ "$actual_jar_sha" == "$expected_jar_sha" ]]
          grep -F -x -q 'distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -F -x -q 'distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a' gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          # Install exact packages ourselves below so the log clearly shows which SDK component
          # failed if Google changes repository metadata or a runner image changes.
          packages: ''

      - name: Install exact Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "sdkmanager=$(command -v sdkmanager || true)"
            sdkmanager --version
            platform_package="platforms;android-${ANDROID_PLATFORM_PACKAGE}"
            platform_dir="android-${ANDROID_PLATFORM_PACKAGE}"
            echo "Resolved Android platform package: ${platform_package}"
            echo "Resolved Android platform directory: ${platform_dir}"

            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager --install \
              "platform-tools" \
              "${platform_package}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" \
              "ndk;${ANDROID_NDK}" \
              "cmake;${ANDROID_CMAKE}"
            echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
            echo "Installed/available packages:"
            sdkmanager --list
          } 2>&1 | tee ci-logs/android-sdk.log

          test -f "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_PLATFORM_PACKAGE}/android.jar"
          test -x "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          test -x "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"
          test -x "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}"
          test -d "${ANDROID_SDK_ROOT}/cmake/${ANDROID_CMAKE}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Record build environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          {
            echo '=== Java ==='
            java -version
            echo '=== Gradle wrapper ==='
            ./gradlew --no-daemon --version
            echo '=== Android build tools ==='
            "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2" version
            "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign" -h 2>&1 | head -5 || true
            echo '=== NDK ==='
            cat "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}/source.properties"
            echo '=== CMake ==='
            "${ANDROID_SDK_ROOT}/cmake/${ANDROID_CMAKE}/bin/cmake" --version
          } 2>&1 | tee ci-logs/environment.log

      - name: Resolve critical release dependencies
        id: dependency_audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          {
            echo '=== releaseRuntimeClasspath ==='
            ./gradlew --no-daemon --console=plain :app:dependencies --configuration releaseRuntimeClasspath
            for dep in graphics-path graphics-shapes datastore work-runtime room-runtime glance-appwidget; do
              echo
              echo "=== dependencyInsight: ${dep} ==="
              ./gradlew --no-daemon --console=plain :app:dependencyInsight \
                --configuration releaseRuntimeClasspath \
                --dependency "${dep}" || true
            done
          } 2>&1 | tee ci-logs/release-dependencies.log

      - name: Inspect release R8 dependencies
        id: r8_audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace --warning-mode all --console=plain :app:dependencies --configuration releaseRuntimeClasspath \
            2>&1 | tee ci-logs/r8-config-analyzer.log

      - name: Run trusted-origin unit tests
        id: unit_tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace --warning-mode all --console=plain :app:testDebugUnitTest \
            2>&1 | tee ci-logs/unit-tests.log

      - name: Run Android lint
        id: lint_audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace --warning-mode all --console=plain :app:lintRelease \
            2>&1 | tee ci-logs/lint-release.log

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SPOTILOL_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SPOTILOL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPOTILOL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPOTILOL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          if [[ -n "${KEYSTORE_B64:-}" && -n "${STORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > keystore/release.jks
            cat > keystore/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
            echo "SPOTILOL_SIGNING_MODE=production" >> "$GITHUB_ENV"
            echo "Release signing mode: production secret keystore"
          else
            ci_password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
            keytool -genkeypair -noprompt \
              -keystore keystore/release.jks \
              -storetype JKS \
              -storepass "$ci_password" \
              -keypass "$ci_password" \
              -alias spotilol-ci \
              -keyalg RSA \
              -keysize 4096 \
              -validity 3650 \
              -dname "CN=Spotilol CI Test, OU=CI, O=Spotilol, L=CI, ST=CI, C=SK"
            cat > keystore/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${ci_password}
          keyAlias=spotilol-ci
          keyPassword=${ci_password}
          EOF
            echo "SPOTILOL_SIGNING_MODE=ci-test" >> "$GITHUB_ENV"
            echo "Release signing mode: ephemeral CI test key"
            echo "WARNING: This certificate is intentionally regenerated per CI run and is not suitable for production upgrades."
          fi
          test -s keystore/release.jks
          test -s keystore/keystore.properties

      - name: Build debug APK
        id: build_debug
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --warning-mode all --console=plain :app:assembleDebug \
            2>&1 | tee ci-logs/gradle-debug.log

      - name: Build release APK
        id: build_release
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --warning-mode all --console=plain :app:assembleRelease \
            2>&1 | tee ci-logs/gradle-release.log

      - name: Verify APK outputs
        id: verify_apks
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          shopt -s nullglob
          debug_apks=(app/build/outputs/apk/debug/*.apk)
          release_apks=(app/build/outputs/apk/release/*.apk)
          apks=("${debug_apks[@]}" "${release_apks[@]}")
          if (( ${#debug_apks[@]} != 1 || ${#release_apks[@]} != 1 )); then
            echo "Expected exactly one debug and one release APK; found debug=${#debug_apks[@]} release=${#release_apks[@]}" \
              | tee ci-logs/apk-verification.log >&2
            exit 1
          fi

          expected_version_name="$(apkanalyzer manifest version-name "${release_apks[0]}" | tr -d '\r\n')"
          expected_version_code="$(apkanalyzer manifest version-code "${release_apks[0]}" | tr -d '\r\n')"
          echo "Expected version from release APK: ${expected_version_name}(${expected_version_code})"

          : > SHA256SUMS.txt
          : > ci-logs/apk-verification.log
          for apk in "${apks[@]}"; do
            {
              echo "==> $apk"
              sha256sum "$apk" | tee -a SHA256SUMS.txt

              app_id="$(apkanalyzer manifest application-id "$apk" | tr -d '\r\n')"
              version_name="$(apkanalyzer manifest version-name "$apk" | tr -d '\r\n')"
              version_code="$(apkanalyzer manifest version-code "$apk" | tr -d '\r\n')"
              min_sdk="$(apkanalyzer manifest min-sdk "$apk" | tr -d '\r\n')"
              target_sdk="$(apkanalyzer manifest target-sdk "$apk" | tr -d '\r\n')"
              debuggable="$(apkanalyzer manifest debuggable "$apk" | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"
              echo "APK identity: id=${app_id} version=${version_name}(${version_code}) minSdk=${min_sdk} targetSdk=${target_sdk} debuggable=${debuggable}"
              [[ "$app_id" == "com.spotify.music" ]]
              [[ "$version_name" == "$expected_version_name" ]]
              [[ "$version_code" == "$expected_version_code" ]]
              [[ "$min_sdk" == "28" ]]
              [[ "$target_sdk" == "36" ]]
              if [[ "$apk" == *"/debug/"* ]]; then
                [[ "$debuggable" == "true" ]]
              else
                [[ "$debuggable" == "false" ]]
              fi

              "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign" -c -P 16 -v 4 "$apk" >/dev/null
              python3 scripts/check_elf_alignment.py "$apk"
              echo "Resolved AndroidX versions in APK:"
              for meta in \
                androidx.glance_glance.version \
                androidx.glance_glance-appwidget.version \
                androidx.datastore_datastore.version \
                androidx.datastore_datastore-preferences.version \
                androidx.graphics_graphics-path.version \
                androidx.graphics_graphics-shapes.version \
                androidx.work_work-runtime.version \
                androidx.room_room-runtime.version; do
                value="$(unzip -p "$apk" "META-INF/${meta}" 2>/dev/null | tr -d '\r\n' || true)"
                printf '  %-55s %s\n' "$meta" "${value:-not-packaged}"
              done
              if "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "$apk" >/dev/null 2>&1; then
                echo "Signature: valid"
                "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --print-certs "$apk" | sed -n '1,12p'
                if [[ "$apk" != *"/debug/"* && "${SPOTILOL_SIGNING_MODE:-}" == "production" ]]; then
                  actual_cert_sha="$("${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --print-certs "$apk" \
                    | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')"
                  echo "Production certificate SHA-256: ${actual_cert_sha}"
                  [[ "$actual_cert_sha" == "${SPOTILOL_PRODUCTION_CERT_SHA256}" ]]
                  echo "Production certificate: verified"
                fi
              elif [[ "$apk" == *"/debug/"* || -f keystore/keystore.properties ]]; then
                echo "Signature: INVALID (debug APKs and configured signed releases must verify)" >&2
                "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "$apk" || true
                exit 1
              else
                echo "Signature: unsigned (expected for release when no signing secrets are configured)"
              fi
            } 2>&1 | tee -a ci-logs/apk-verification.log
          done

      - name: Prepare distributable release package
        id: prepare_release
        if: steps.verify_apks.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist/release

          release_apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#release_apks[@]} != 1 )); then
            echo "Expected exactly one release APK, found ${#release_apks[@]}" >&2
            exit 1
          fi
          release_apk="${release_apks[0]}"

          app_id="$(apkanalyzer manifest application-id "$release_apk" | tr -d '\r\n')"
          version_name="$(apkanalyzer manifest version-name "$release_apk" | tr -d '\r\n')"
          version_code="$(apkanalyzer manifest version-code "$release_apk" | tr -d '\r\n')"
          min_sdk="$(apkanalyzer manifest min-sdk "$release_apk" | tr -d '\r\n')"
          target_sdk="$(apkanalyzer manifest target-sdk "$release_apk" | tr -d '\r\n')"
          debuggable="$(apkanalyzer manifest debuggable "$release_apk" | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"

          safe_version="$(printf '%s' "$version_name" | tr -c 'A-Za-z0-9._-' '-')"
          release_label="${SPOTILOL_SIGNING_MODE:-unknown}"
          output_name="Spotilol-${safe_version}-${release_label}.apk"
          output_path="dist/release/${output_name}"
          cp "$release_apk" "$output_path"

          cert_sha="$("${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --print-certs "$output_path" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')"
          apk_sha="$(sha256sum "$output_path" | awk '{print $1}')"

          if [[ "$release_label" == "production" ]]; then
            [[ "$cert_sha" == "${SPOTILOL_PRODUCTION_CERT_SHA256}" ]]
          fi

          (
            cd dist/release
            sha256sum "$output_name" > SHA256SUMS.txt
          )

          cat > dist/release/RELEASE_INFO.txt <<EOF
          Product: Spotilol
          Application ID: ${app_id}
          Version name: ${version_name}
          Version code: ${version_code}
          Build type: release
          Debuggable: ${debuggable}
          Min SDK: ${min_sdk}
          Target SDK: ${target_sdk}
          Signing mode: ${release_label}
          Certificate SHA-256: ${cert_sha}
          APK filename: ${output_name}
          APK SHA-256: ${apk_sha}
          16 KiB ELF layout: verified
          zipalign -P 16: verified
          APK signature: verified
          Git commit: ${GITHUB_SHA}
          GitHub Actions run: ${GITHUB_RUN_ID}
          EOF

          echo "Prepared release package:"
          cat dist/release/RELEASE_INFO.txt
          cat dist/release/SHA256SUMS.txt

      - name: Upload distributable release package
        if: steps.prepare_release.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: Spotilol-release-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/release/**

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotilol-ci-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            SHA256SUMS.txt
            ci-logs/**
            app/build/reports/r8/**
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-release.*
            app/build/reports/lint-results-release/**
            app/build/outputs/mapping/release/**

      - name: Enforce build result
        if: always()
        shell: bash
        env:
          DEBUG_OUTCOME: ${{ steps.build_debug.outcome }}
          RELEASE_OUTCOME: ${{ steps.build_release.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_apks.outcome }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency_audit.outcome }}
          R8_OUTCOME: ${{ steps.r8_audit.outcome }}
          TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint_audit.outcome }}
          PACKAGE_OUTCOME: ${{ steps.prepare_release.outcome }}
        run: |
          echo "Debug build:   ${DEBUG_OUTCOME}"
          echo "Release build: ${RELEASE_OUTCOME}"
          echo "APK verify:    ${VERIFY_OUTCOME}"
          echo "Dependencies:  ${DEPENDENCY_OUTCOME}"
          echo "R8 analyzer:   ${R8_OUTCOME}"
          echo "Unit tests:    ${TEST_OUTCOME}"
          echo "Android lint:  ${LINT_OUTCOME}"
          echo "Release pack:  ${PACKAGE_OUTCOME}"
          if [[ "$DEPENDENCY_OUTCOME" != "success" || "$R8_OUTCOME" != "success" || "$TEST_OUTCOME" != "success" || "$LINT_OUTCOME" != "success" || "$DEBUG_OUTCOME" != "success" || "$RELEASE_OUTCOME" != "success" || "$VERIFY_OUTCOME" != "success" || "$PACKAGE_OUTCOME" != "success" ]]; then
            echo "Spotilol build/verification/release packaging failed. Download the diagnostics artifact for full logs." >&2
            exit 1
          fi


  publish_release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SPOTILOL_PRODUCTION_CERT_SHA256: 'a5757d4bca7f0939accc83d8e9b73017b18c6af45ae5f8eba694249f80eba985'

    steps:
      - name: Download verified release package
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="Spotilol-release-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p release-package
          gh run download "${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${artifact_name}" \
            --dir release-package
          find release-package -maxdepth 2 -type f -print

      - name: Validate tag and production release metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          info="release-package/RELEASE_INFO.txt"
          sums="release-package/SHA256SUMS.txt"
          apks=(release-package/Spotilol-*-production.apk)

          test -f "$info"
          test -f "$sums"
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one production APK, found ${#apks[@]}" >&2
            exit 1
          fi

          version_name="$(awk -F': ' '/^Version name:/ {print $2; exit}' "$info")"
          version_code="$(awk -F': ' '/^Version code:/ {print $2; exit}' "$info")"
          signing_mode="$(awk -F': ' '/^Signing mode:/ {print $2; exit}' "$info")"
          cert_sha="$(awk -F': ' '/^Certificate SHA-256:/ {print tolower($2); exit}' "$info")"
          apk_name="$(awk -F': ' '/^APK filename:/ {print $2; exit}' "$info")"
          expected_tag="v${version_name}"

          echo "Git tag:              ${GITHUB_REF_NAME}"
          echo "Release version:      ${version_name}(${version_code})"
          echo "Signing mode:         ${signing_mode}"
          echo "Certificate SHA-256:  ${cert_sha}"
          echo "APK:                  ${apk_name}"

          [[ "${GITHUB_REF_NAME}" == "${expected_tag}" ]]
          [[ "${signing_mode}" == "production" ]]
          [[ "${cert_sha}" == "${SPOTILOL_PRODUCTION_CERT_SHA256}" ]]
          [[ "${apk_name}" == "$(basename "${apks[0]}")" ]]

          (
            cd release-package
            sha256sum -c SHA256SUMS.txt
          )

          echo "VERSION_NAME=${version_name}" >> "$GITHUB_ENV"
          echo "PRODUCTION_APK=${apks[0]}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; clearing description and replacing release assets."
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Spotilol ${VERSION_NAME}" \
              --notes ""
            gh release upload "${GITHUB_REF_NAME}" \
              "${PRODUCTION_APK}" \
              release-package/SHA256SUMS.txt \
              release-package/RELEASE_INFO.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${PRODUCTION_APK}" \
              release-package/SHA256SUMS.txt \
              release-package/RELEASE_INFO.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "Spotilol ${VERSION_NAME}" \
              --notes ""
          fi

          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
